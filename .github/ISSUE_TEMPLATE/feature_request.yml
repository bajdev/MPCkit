name: Feature request
description: Suggest something mpckit should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task on the MPC Sample or in mpckit, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
