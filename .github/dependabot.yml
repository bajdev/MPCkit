version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ['*']
    ignore:
      # Wails is pinned on purpose; upgrade it by hand together with the wails3 CLI.
      - dependency-name: github.com/wailsapp/wails/v3

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ['*']
    ignore:
      # svelte-check (npm run check) supports TypeScript 5 and 6 only. Remove
      # this once a svelte-check release accepts TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']
